- id: UNKNOWN-008
  summary: "Runtime behavior of async report_actual under Cloud Run scale-to-zero"
  classification: UNKNOWN
  details: |
    cloud_management_client report_actual is async (background daemon
    thread) by default. When running on Cloud Run with scale-to-zero
    and concurrency=1, the client (running in sub-projects, not the hub)
    may have its background thread killed if the sub-project's Cloud Run
    instance scales to zero before the spool flushes. The durable spool
    (spool.py) should survive, but the interaction between async
    reporting, spool durability, and Cloud Run cold starts has not been
    verified at runtime.
  evidence:
    - {path: cloud_management_client/_actual_ops.py, symbol: report_actual, evidence_type: source, classification: OBSERVED}
    - {path: cloud_management_client/spool.py, evidence_type: source, classification: OBSERVED}
    - {path: terraform/cloud_run.tf, symbol: "scale 0-1", evidence_type: iac, classification: OBSERVED}
  verification: "Run integration test with a real Cloud Run sub-project; observe spool recovery after cold start"
