- id: UNKNOWN-001
  summary: "Production deployment topology — Cloud Run region, actual project IDs, live config values"
  classification: UNKNOWN
  details: |
    Terraform uses variables (var.project_id, var.region) with no
    committed terraform.tfvars. The actual hub project ID, Cloud Run
    region, and monitored project IDs in production are not visible from
    repo evidence. All references to project IDs in docs use placeholder
    examples (e.g., "your-project", "your-deprecated-project-id").
  evidence:
    - {path: terraform/variables.tf, evidence_type: iac, classification: OBSERVED}
    - {path: terraform/terraform.tfvars.example, evidence_type: config, classification: OBSERVED}
    - {path: docs/PRD.md, evidence_type: doc, classification: OBSERVED}
  verification: "Check committed terraform.tfvars (gitignored) or gcloud run services list in the hub project"

- id: UNKNOWN-002
  summary: "Whether Firestore composite indexes are provisioned for intent/actual queries"
  classification: UNKNOWN
  details: |
    intent_storage.py uses single-field queries to avoid composite index
    requirements (OBSERVED in list_actuals — queries by intent_id OR
    project_id, filters secondary field in memory). However, if any
    query uses multiple equality filters or filter+orderBy on different
    fields, a composite index would be needed. No terraform
    google_firestore_index resource was found in the split Terraform
    files. If composite indexes are needed but not provisioned, queries
    will fail with FAILED_PRECONDITION errors at runtime.
  evidence:
    - {path: intent_storage.py, symbol: list_actuals, evidence_type: source, classification: OBSERVED}
    - {path: terraform/, evidence_type: iac, classification: OBSERVED}
  verification: "Check Firestore indexes in GCP Console or gcloud firestore indexes list for the hub project"

- id: UNKNOWN-003
  summary: "Actual report token rotation procedure"
  classification: UNKNOWN
  details: |
    intent_auth.py validates per-project bearer tokens via
    secrets.compare_digest. Tokens are referenced by
    account.report_token_secret (env var name or Secret Manager ref).
    No documented procedure for rotating these tokens exists in the
    repo. The /api/v1/exposure endpoint exists for reporting key
    exposure, but the rotation workflow (who rotates, how clients get
    new tokens, how old tokens are invalidated) is not described.
  evidence:
    - {path: intent_auth.py, symbol: _validate_token, evidence_type: source, classification: OBSERVED}
    - {path: intent_routes.py, symbol: report_exposure, evidence_type: source, classification: OBSERVED}
    - "No rotation runbook or doc found in docs/ or README.md"
  verification: "Ask project owner for token rotation runbook; check Secret Manager for rotation config"

- id: UNKNOWN-004
  summary: "Whether BigQuery billing export is enabled in production (Console-only step)"
  classification: UNKNOWN
  details: |
    dashboard.py and providers/gcp.py query BigQuery billing export
    tables. Terraform provisions the BigQuery dataset
    (google_bigquery_dataset.cloud_billing_export) but enabling the
    billing export to populate the table is a manual Console step not
    captured in IaC. The dashboard degrades gracefully if BigQuery is
    not configured (warning banner), so this is not a hard failure.
  evidence:
    - {path: terraform/storage.tf, symbol: google_bigquery_dataset, evidence_type: iac, classification: OBSERVED}
    - {path: dashboard.py, symbol: _query_bq, evidence_type: source, classification: OBSERVED}
  verification: "Check GCP Console → Billing → Billing export → BigQuery export status for the hub billing account"

