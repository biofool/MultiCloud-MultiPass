- id: DEBT-001
  summary: "pytest-flask version incompatibility causes 45 errors in test_intent.py"
  classification: confirmed-defect
  priority_score: 27  # impact=3 × likelihood=3 × reach=3
  impact: high
  likelihood: high
  reach: high
  details: |
    tests/test_intent.py (35 tests, 647 lines) produces 45 ERRORS due to
    AttributeError: 'FlaskClient' object has no attribute 'response_class'.
    This is a pytest-flask version incompatibility — pytest-flask is not
    listed in requirements.txt or pyproject.toml dev dependencies, yet the
    test file appears to depend on it (or a specific Flask version's test
    client behavior). The intent/actual protocol is the highest-risk
    component after the kill switch, and its entire test suite is
    non-functional.
  evidence:
    - {path: tests/test_intent.py, evidence_type: test, classification: OBSERVED}
    - {path: pyproject.toml, symbol: "[project.optional-dependencies]", evidence_type: config, classification: OBSERVED}
    - {path: .ai-context/manifest.yaml, symbol: limitations, evidence_type: analysis, classification: OBSERVED}
  verification: "Run .venv/bin/python -m pytest tests/test_intent.py -v and observe AttributeError errors"
  recommendation: "Pin pytest-flask version or update test client usage to match installed Flask version"

- id: DEBT-002
  summary: "Client package version mismatch: pyproject.toml=0.3.0, __init__.py=0.12.0"
  classification: confirmed-defect
  priority_score: 24  # impact=3 × likelihood=3 × reach=2 (downstream consumers)
  impact: high
  likelihood: high
  reach: medium
  details: |
    pyproject.toml declares version = "0.3.0" but
    cloud_management_client/__init__.py declares __version__ = "0.12.0".
    All context artifacts, test comments, and code comments reference
    v0.12.0. The pyproject.toml version appears stale or was reset during
    the fork. Downstream sub-projects pip-installing this package may get
    the wrong version number, affecting compatibility checks (tests
    already compare parsed version tuples — see
    test_cloud_management_client.py:210).
  evidence:
    - {path: pyproject.toml, symbol: version, lines: "7", evidence_type: config, classification: OBSERVED}
    - {path: cloud_management_client/__init__.py, symbol: __version__, lines: "137", evidence_type: source, classification: OBSERVED}
    - {path: tests/test_cloud_management_client.py, symbol: "version comparison", lines: "210-211", evidence_type: test, classification: OBSERVED}
  verification: "grep version pyproject.toml and grep __version__ cloud_management_client/__init__.py"
  recommendation: "Sync pyproject.toml version to 0.12.0 (or bump both to a new agreed version)"

