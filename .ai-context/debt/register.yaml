- id: DEBT-008
  summary: "In-memory dedup cache is per-container, not persistent — redelivery after cold start possible"
  classification: architectural-risk
  priority_score: 6  # impact=2 × likelihood=2 × reach=1
  impact: medium
  likelihood: medium
  reach: low
  details: |
    dedup.py uses _processed_messages dict (in-memory, 10-min TTL).
    Cloud Run scale-to-zero means the container can cold-start between
    alert deliveries, losing the dedup cache. Pub/Sub redelivery after
    cold start could cause duplicate kill switch executions. The kill
    actions themselves are mostly idempotent (scale to 0, disable
    billing), but duplicate execution adds noise and API calls.
  evidence:
    - {path: dedup.py, symbol: _processed_messages, evidence_type: source, classification: OBSERVED}
    - {path: .ai-context/components/budget-alert.md, symbol: "Dedup is per-container", evidence_type: analysis, classification: OBSERVED}
  verification: "Review dedup.py — no persistence mechanism (Firestore/Redis)"
  recommendation: "Consider Firestore-backed dedup if duplicate kills become noisy in production"

