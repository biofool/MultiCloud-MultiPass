{# Split out of the original monolithic dashboard.html — pure structural move, no behavior change. #}
      <!-- Stat cards row -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- MTD Spend -->
        <div class="stat-card rounded-xl border border-slate-800 bg-slate-900 p-5">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">MTD Spend</span>
            <span class="text-xs text-slate-500" id="mtd-currency">USD</span>
          </div>
          <div class="text-3xl font-bold" id="mtd-cost">$0.00</div>
          <div class="mt-2 text-xs text-slate-400">of <span id="budget-amount">${{ budget }}.00</span> budget</div>
        </div>

        <!-- Budget Used -->
        <div class="stat-card rounded-xl border border-slate-800 bg-slate-900 p-5">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Budget Used</span>
          </div>
          <div class="text-3xl font-bold" id="pct-of-budget">0%</div>
          <div class="mt-3">
            <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
              <div id="budget-bar" class="progress-bar h-full rounded-full bg-gradient-to-r from-emerald-500 to-cyan-500" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Remaining -->
        <div class="stat-card rounded-xl border border-slate-800 bg-slate-900 p-5">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Remaining</span>
          </div>
          <div class="text-3xl font-bold" id="remaining">$0.00</div>
          <div class="mt-2 text-xs" id="remaining-status">--</div>
        </div>

        <!-- Spike Alert -->
        <div class="stat-card rounded-xl border border-slate-800 bg-slate-900 p-5">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">vs 7-day Avg</span>
          </div>
          <div class="text-3xl font-bold" id="spike-pct">--</div>
          <div class="mt-2 text-xs text-slate-400" id="spike-detail">Yesterday vs baseline</div>
        </div>
      </div>
