{# Split out of the original monolithic dashboard.html — pure structural move, no behavior change. #}
  <script>
    // ---- Chart instances ----
    let dailyChart = null;
    let servicesChart = null;

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
    };

    // ---- Fetch helper ----
    async function fetchJSON(url) {
      try {
        const resp = await fetch(url);
        if (!resp.ok) return null;
        return await resp.json();
      } catch { return null; }
    }

    // ---- Format helpers ----
    const fmt$ = (v) => '$' + Number(v).toFixed(2);
    const fmtPct = (v) => Math.round(v) + '%';

    // ---- Update summary cards ----
    async function loadSummary() {
      const data = await fetchJSON('/api/summary');
      if (!data) return;

      document.getElementById('mtd-cost').textContent = fmt$(data.mtd_cost);
      document.getElementById('mtd-currency').textContent = data.currency || 'USD';
      document.getElementById('budget-amount').textContent = fmt$(data.budget);
      document.getElementById('pct-of-budget').textContent = fmtPct(data.pct_of_budget);
      document.getElementById('remaining').textContent = fmt$(data.remaining);

      const bar = document.getElementById('budget-bar');
      const pct = Math.min(data.pct_of_budget, 100);
      bar.style.width = pct + '%';

      // Color based on budget usage
      if (data.pct_of_budget >= 100) {
        bar.className = 'progress-bar h-full rounded-full bg-gradient-to-r from-red-600 to-red-500';
        document.getElementById('remaining-status').innerHTML = '<span class="text-red-400 font-medium">Budget exceeded</span>';
      } else if (data.pct_of_budget >= 90) {
        bar.className = 'progress-bar h-full rounded-full bg-gradient-to-r from-orange-600 to-amber-500';
        document.getElementById('remaining-status').innerHTML = '<span class="text-amber-400">Near limit</span>';
      } else if (data.pct_of_budget >= 50) {
        bar.className = 'progress-bar h-full rounded-full bg-gradient-to-r from-amber-500 to-yellow-500';
        document.getElementById('remaining-status').innerHTML = '<span class="text-slate-400">On track</span>';
      } else {
        bar.className = 'progress-bar h-full rounded-full bg-gradient-to-r from-emerald-500 to-cyan-500';
        document.getElementById('remaining-status').innerHTML = '<span class="text-emerald-400">Healthy</span>';
      }

      document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }

    // ---- Update spike card ----
    async function loadSpike() {
      const data = await fetchJSON('/api/spike');
      if (!data) return;
      const pct = data.pct_of_baseline;
      const el = document.getElementById('spike-pct');
      el.textContent = pct > 0 ? fmtPct(pct) : '--';
      if (pct >= 150) el.className = 'text-3xl font-bold text-red-400';
      else if (pct >= 120) el.className = 'text-3xl font-bold text-amber-400';
      else el.className = 'text-3xl font-bold text-emerald-400';
      document.getElementById('spike-detail').textContent =
        fmt$(data.yesterday_cost) + ' vs ' + fmt$(data.daily_avg_7d) + '/day avg';
    }

    // ---- Update daily chart ----
    async function loadDailyChart() {
      const data = await fetchJSON('/api/daily');
      if (!data) return;
      const ctx = document.getElementById('daily-chart').getContext('2d');
      if (dailyChart) dailyChart.destroy();
      dailyChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels.map(l => l.substring(5)),
          datasets: [{
            data: data.values,
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#06b6d4',
          }]
        },
        options: {
          ...chartDefaults,
          scales: {
            x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#64748b', font: { size: 10 }, callback: v => '$' + v }, grid: { color: '#1e293b' } },
          }
        }
      });
    }

    // ---- Update services chart ----
    async function loadServicesChart() {
      const data = await fetchJSON('/api/services');
      if (!data) return;
      const ctx = document.getElementById('services-chart').getContext('2d');
      if (servicesChart) servicesChart.destroy();
      const colors = ['#06b6d4', '#8b5cf6', '#f59e0b', '#10b981', '#ef4444', '#3b82f6', '#ec4899', '#84cc16', '#f97316', '#14b8a6'];
      servicesChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.labels,
          datasets: [{
            data: data.values,
            backgroundColor: colors.slice(0, data.labels.length),
            borderColor: '#0f172a',
            borderWidth: 2,
          }]
        },
        options: {
          ...chartDefaults,
          plugins: {
            legend: {
              display: true,
              position: 'bottom',
              labels: { color: '#94a3b8', font: { size: 10 }, boxWidth: 12, padding: 8 }
            }
          },
          cutout: '60%',
        }
      });
    }

    // ---- Update projects list ----
    async function loadProjects() {
      const data = await fetchJSON('/api/projects');
      if (!data || !data.projects || data.projects.length === 0) {
        document.getElementById('projects-list').innerHTML = '<div class="text-sm text-slate-500 py-8 text-center">No data</div>';
        return;
      }
      const maxCost = data.projects[0].total_cost || 1;
      const html = data.projects.map(p => {
        const pct = Math.round(p.total_cost / maxCost * 100);
        return `
          <div class="flex items-center gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-mono text-slate-300 truncate">${p.project_id}</span>
                <span class="text-xs font-medium text-slate-400 ml-2">${fmt$(p.total_cost)}</span>
              </div>
              <div class="h-1.5 rounded-full bg-slate-800 overflow-hidden">
                <div class="h-full rounded-full bg-cyan-500/60" style="width: ${pct}%"></div>
              </div>
            </div>
          </div>`;
      }).join('');
      document.getElementById('projects-list').innerHTML = html;
    }

    // ---- Update team accounts list ----
    async function loadTeam() {
      const data = await fetchJSON('/api/accounts');
      const el = document.getElementById('team-list');
      if (!data || !data.accounts || data.accounts.length === 0) {
        el.innerHTML = '<div class="text-sm text-slate-500 py-8 text-center">No accounts registered — see scripts/register_project.py</div>';
        return;
      }
      const html = data.accounts.map(a => {
        const pct = Math.min(a.pct_of_budget, 100);
        const barColor = a.pct_of_budget >= 100 ? 'from-red-600 to-red-500'
          : a.pct_of_budget >= 90 ? 'from-orange-600 to-amber-500'
          : a.pct_of_budget >= 50 ? 'from-amber-500 to-yellow-500'
          : 'from-emerald-500 to-cyan-500';
        const allowlistBadge = a.allowlist
          ? '<span class="text-xs font-medium px-2 py-0.5 rounded-md border text-slate-400 bg-slate-800/50 border-slate-700/50">allowlisted</span>'
          : '';
        return `
          <div class="rounded-lg bg-slate-800/40 border border-slate-700/40 p-3">
            <div class="flex items-center justify-between mb-1 gap-3">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-xs font-mono text-slate-200 truncate">${a.project_id}</span>
                <span class="text-xs text-slate-500 truncate">${a.owner_email}</span>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0">
                ${allowlistBadge}
                <span class="text-xs font-medium text-slate-400">${fmt$(a.mtd_cost)} / ${fmt$(a.budget_amount_usd)}</span>
              </div>
            </div>
            <div class="h-1.5 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r ${barColor}" style="width: ${pct}%"></div>
            </div>
          </div>`;
      }).join('');
      el.innerHTML = html;
    }

    // ---- Update kill switch config ----
    async function loadConfig() {
      const data = await fetchJSON('/');
      if (!data) return;

      // Dry run badge
      const badge = document.getElementById('dry-run-badge');
      if (data.dry_run) badge.classList.remove('hidden');
      else badge.classList.add('hidden');

      const items = [
        { label: 'Mode', value: data.dry_run ? 'DRY RUN (log only)' : 'LIVE', color: data.dry_run ? 'amber' : 'emerald' },
        { label: 'Allowlisted Projects', value: data.allowlist.length > 0 ? data.allowlist.join(', ') : 'none', color: 'slate' },
        { label: 'Billing Shutoff', value: data.billing_shutoff ? 'ENABLED' : 'disabled', color: data.billing_shutoff ? 'red' : 'slate' },
        { label: 'Scheduler Pause', value: data.run_pause ? 'enabled' : 'disabled', color: data.run_pause ? 'emerald' : 'slate' },
        { label: 'Trigger Disable', value: data.trigger_disable ? 'enabled' : 'disabled', color: data.trigger_disable ? 'emerald' : 'slate' },
        { label: 'Stop Instances', value: data.stop_compute ? 'enabled' : 'disabled', color: data.stop_compute ? 'emerald' : 'slate' },
      ];

      const colorMap = {
        amber: 'text-amber-400 bg-amber-500/10 border-amber-500/20',
        emerald: 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20',
        red: 'text-red-400 bg-red-500/10 border-red-500/20',
        slate: 'text-slate-400 bg-slate-800/50 border-slate-700/50',
      };

      const html = items.map(item => `
        <div class="flex items-center justify-between gap-3">
          <span class="text-xs text-slate-400">${item.label}</span>
          <span class="text-xs font-medium px-2.5 py-1 rounded-md border ${colorMap[item.color]}">${item.value}</span>
        </div>`).join('');
      document.getElementById('config-list').innerHTML = html;
    }

    // ---- Refresh all ----
    function refreshAll() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('spin');
      Promise.all([loadSummary(), loadSpike(), loadDailyChart(), loadServicesChart(), loadProjects(), loadTeam(), loadConfig()])
        .finally(() => setTimeout(() => icon.classList.remove('spin'), 500));
    }

    // ---- Init ----
    refreshAll();
    // Auto-refresh every 5 minutes
    setInterval(refreshAll, 300000);
  </script>
